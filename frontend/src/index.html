<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monorepo Frontend</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 2rem;
            letter-spacing: -0.5px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            margin-top: 1rem;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Monorepo Frontend</h1>
        <p>Esta es una demostración de una SPA para el laboratorio de optimización y pipelines de monorepos.</p>
        <div id="app">Cargando aplicación...</div>
        <button class="btn" id="action-btn">Interactuar</button>
    </div>
    <!-- BUNDLE_INJECT -->
</body>
</html>
