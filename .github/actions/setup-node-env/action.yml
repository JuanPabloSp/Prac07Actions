name: 'Setup Node Environment with Cache'
description: 'Sets up Node.js, configures caching for npm dependencies, and verifies environment'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  working-directory:
    description: 'Working directory containing package.json'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '${{ inputs.working-directory }}/package.json'

    - name: Verify Environment
      shell: bash
      run: |
        echo "🟢 Node version: $(node -v)"
        echo "🟢 NPM version: $(npm -v)"
        echo "🟢 Running in: ${{ inputs.working-directory }}"
